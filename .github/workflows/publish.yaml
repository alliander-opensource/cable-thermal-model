name: (CI) publish Package
on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["github-actions[bot]", "release-please[bot]"]'), github.event.pull_request.user.login) &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--'))
    runs-on: mgd-ubuntu24-x64-4c16g
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"
          install-args: "--frozen --no-default-groups"
          cache-key-suffix: publish

      - name: Build package
        run: uv build

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cable-thermal-model-package
          path: dist/
  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build-package
    runs-on: mgd-ubuntu24-x64-4c16g
    environment:
      name: pypi
      url: https://pypi.org/project/cable-thermal-model
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cable-thermal-model-package
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
