name: (CI) publish Package
on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  build-package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'release-please[bot]')
    runs-on: mgd-ubuntu24-x64-4c16g
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"
          install-args: "--frozen --no-default-groups"
          cache-key-suffix: publish

      - name: Build package
        run: uv build

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: cable-thermal-model-package
          path: dist/
  publish-to-pypi-test:
    name: Publish to TestPyPI
    needs:
      - build-package
    runs-on: mgd-ubuntu24-x64-4c16g
    environment:
      name: pypi-test #pypi
      url: https://test.pypi.org/p/cable-thermal-model #https://pypi.org/project/cable-thermal-model
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: cable-thermal-model-package
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 #v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/ #https://upload.pypi.org/legacy/
