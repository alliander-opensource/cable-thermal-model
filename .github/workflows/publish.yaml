name: (CI) publish Package
on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build-package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'release-please[bot]')
    runs-on: mgd-ubuntu24-x64-4c16g
    outputs:
      package_version: ${{ steps.package_version.outputs.package_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"
          install-args: "--frozen --no-default-groups"
          cache-key-suffix: publish

      - name: Read package version
        id: package_version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      - name: Build package
        run: uv build

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: cable-thermal-model-package
          path: dist/
  publish-to-pypi-test:
    name: Publish to TestPyPI
    needs:
    - build-package
    runs-on: mgd-ubuntu24-x64-4c16g
    environment:
      name: pypi-test #pypi
      url: https://test.pypi.org/p/cable-thermal-model #https://pypi.org/project/cable-thermal-model
    permissions:
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: cable-thermal-model-package
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b #v1.14.0
      with:
        repository-url: https://test.pypi.org/legacy/ #https://upload.pypi.org/legacy/
